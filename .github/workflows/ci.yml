name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno task lint

      - name: Type check
        run: deno task check

      - name: Tests (unit + e2e)
        run: deno task test

      - name: Governance tree check
        run: deno task gov check

      - name: Publish dry-run
        run: deno publish --dry-run --allow-dirty
