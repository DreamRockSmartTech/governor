name: Publish to JSR

# Publishes all workspace packages when a version tag is pushed. JSR
# authenticates the workflow via GitHub OIDC (`id-token: write`) — link the
# packages to this repository in their JSR settings; no token secrets needed.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify before publish
        run: |
          deno fmt --check
          deno task lint
          deno task check
          deno task test

      - name: Publish
        run: deno publish
